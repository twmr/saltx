[project]
name = "saltx"
version = "0.1.0"
authors = [
  { name="Thomas Wimmer", email="thomaswimmer@posteo.com" },
]
description = "An efficient FEM based laser mode solver"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/twmr/saltx"
"Bug Tracker" = "https://github.com/twmr/saltx/issues"

[tool.pytest.ini_options]
addopts = '''
    --verbose
    -rs
    --color=yes
    --log-level=DEBUG
    --log-format="%(asctime)s.%(msecs)03d %(name)15.15s %(levelname)-7s %(message)s"
    --log-date-format="%H:%M:%S"
    --durations=100
'''

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # pyupgrade
    "UP",
    # isort
    "I001",
    "RET",
    # flake8 pytest
    "PT",
    "PERF",
    "RUF",
    # pydocstyle"
    # "D",
    "D401",
]

[tool.ruff.lint.isort]
known-first-party = ["saltx"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
saltx = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.14.*"
fenics-dolfinx = ">=0.10.0,<0.11"
mpi4py = ">=4.1.1,<5"

matplotlib-base = ">=3.10.8,<4"
pandas = ">=3.0.2,<4"
scipy = ">=1.17.1,<2"
petsc = { version = ">=3.25.0,<4", build = "complex_*" }

[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.3,<10"
[tool.pixi.feature.test.tasks]
# In the `test` env this only works when `--hide-plots` is passed on
# the command line, because then the mpl backend is set to 'agg'. If
# the backend is set to `tkagg` (default when `matplotlib-base` is
# installed) then a segfault is raised when `dolfinx` was imported.
# TODO set MPLBACKEND to agg when run the `test` pixi task is run
# inside the `test` env.
test = "pytest"

[tool.pixi.feature.dev.dependencies]
ipython = ">=9.12.0,<10"
matplotlib = ">=3.10.8,<4"

[tool.pixi.environments]
default = {features = [], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
dev = {features = ["dev", "test"], solve-group = "default"}
